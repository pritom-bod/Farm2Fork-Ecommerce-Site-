<style>
    /* AI CHAT BUTTON - Small Size with #81c408 Color */
    .ai-chat-btn {
        position: fixed;
        right: 30px;
        bottom: 83px; 
        width: 45px;  
        height: 45px; 
        border-radius: 50%;
        border: none;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 22px;
        background: #81c408; 
        color: white;
        box-shadow: 0 4px 12px rgba(129, 196, 8, 0.3);
        transition: all 0.3s ease;
        z-index: 9999;
        animation: pulse 2s infinite;
    }

    .ai-chat-btn:hover {
        transform: scale(1.1);
        background: #72ad07; /* Hover এ একটু dark */
        box-shadow: 0 6px 20px rgba(129, 196, 8, 0.5);
    }

    @keyframes pulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.05); }
    }

    /* Chat Window Styles */
    .ai-chat-window {
        position: fixed;
        right: 30px;
        bottom: 160px; 
        width: 350px;
        height: 500px; 
        background: white;
        border-radius: 20px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        display: none;
        flex-direction: column;
        z-index: 9998;
        overflow: hidden;
    }

    .ai-chat-window.active {
        display: flex;
        animation: slideUp 0.3s ease;
    }

    @keyframes slideUp {
        from {
            transform: translateY(20px);
            opacity: 0;
        }
        to {
            transform: translateY(0);
            opacity: 1;
        }
    }

    .chat-header {
        background: #81c408; /* Same color as button */
        color: white;
        padding: 18px;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .chat-header h3 {
        margin: 0;
        font-size: 17px;
        display: flex;
        align-items: center;
        gap: 10px;
    }

    .chat-close-btn {
        background: rgba(255, 255, 255, 0.2);
        border: none;
        color: white;
        width: 28px;
        height: 28px;
        border-radius: 50%;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.3s ease;
    }

    .chat-close-btn:hover {
        background: rgba(255, 255, 255, 0.3);
        transform: rotate(90deg);
    }

    .chat-messages {
        flex: 1;
        overflow-y: auto;
        padding: 18px;
        background: #f8f9fa;
    }

    .chat-message {
        margin-bottom: 14px;
        display: flex;
        align-items: flex-start;
        animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .chat-message.user {
        flex-direction: row-reverse;
    }

    .message-avatar {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 15px;
        flex-shrink: 0;
    }

    .message-avatar.user-avatar {
        background: #667eea;
        color: white;
        margin-left: 8px;
    }

    .message-avatar.bot-avatar {
        background: #81c408; /* Bot avatar same green */
        color: white;
        margin-right: 8px;
    }

    .message-content {
        max-width: 70%;
        padding: 11px 15px;
        border-radius: 16px;
        line-height: 1.4;
        word-wrap: break-word;
        font-size: 14px;
    }

    .chat-message.user .message-content {
        background: #667eea;
        color: white;
        border-bottom-right-radius: 4px;
    }

    .chat-message.bot .message-content {
        background: white;
        color: #333;
        border-bottom-left-radius: 4px;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
    }

    .chat-typing {
        display: none;
        align-items: center;
        gap: 5px;
        padding: 11px 15px;
        background: white;
        border-radius: 16px;
        width: fit-content;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
    }

    .chat-typing.active {
        display: flex;
    }

    .typing-dot {
        width: 7px;
        height: 7px;
        background: #81c408; /* Green typing dots */
        border-radius: 50%;
        animation: typing 1.4s infinite;
    }

    .typing-dot:nth-child(2) {
        animation-delay: 0.2s;
    }

    .typing-dot:nth-child(3) {
        animation-delay: 0.4s;
    }

    @keyframes typing {
        0%, 60%, 100% { transform: translateY(0); }
        30% { transform: translateY(-8px); }
    }

    .chat-input-container {
        padding: 14px;
        background: white;
        border-top: 1px solid #e0e0e0;
        display: flex;
        gap: 10px;
    }

    .chat-input {
        flex: 1;
        padding: 11px 15px;
        border: 2px solid #e0e0e0;
        border-radius: 22px;
        outline: none;
        font-size: 14px;
        transition: all 0.3s ease;
    }

    .chat-input:focus {
        border-color: #81c408; /* Green border on focus */
    }

    .chat-send-btn {
        width: 42px;
        height: 42px;
        background: #81c408; /* Green send button */
        border: none;
        border-radius: 50%;
        color: white;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.3s ease;
    }

    .chat-send-btn:hover:not(:disabled) {
        transform: scale(1.1);
        background: #72ad07;
        box-shadow: 0 4px 12px rgba(129, 196, 8, 0.4);
    }

    .chat-send-btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
    }

    /* Mobile Responsive */
    @media (max-width: 768px) {
        .ai-chat-btn {
            right: 15px;
            bottom: 85px;
            width: 45px;
            height: 45px;
            font-size: 20px;
        }

        .ai-chat-window {
            right: 10px;
            bottom: 140px;
            width: calc(100% - 20px);
            height: 450px;
        }
    }

    /* Custom Scrollbar */
    .chat-messages::-webkit-scrollbar {
        width: 5px;
    }

    .chat-messages::-webkit-scrollbar-track {
        background: #f1f1f1;
    }

    .chat-messages::-webkit-scrollbar-thumb {
        background: #81c408; /* Green scrollbar */
        border-radius: 3px;
    }

    .chat-messages::-webkit-scrollbar-thumb:hover {
        background: #72ad07;
    }
</style>


<!-- Chat Buttons Container -->
<div class="chat-buttons-container">
    <!-- AI Chat Button -->
    <button class="ai-chat-btn" id="aiChatBtn" title="Ask AI Assistant">
         <i class="fas fa-robot"></i>



    </button>
    
    <!-- Scroll to Top Button -->
    <button class="scroll-top-btn" id="scrollTopBtn" title="Back to Top">
        <i class="fa fa-arrow-up"></i>
    </button>
</div>

<!-- Chat Window -->
<div class="ai-chat-window" id="aiChatWindow">
    <div class="chat-header">
        <h3>
            <span>🤖</span>
            <span>Farm2Fork AI Assistant</span>
        </h3>
        <button class="chat-close-btn" id="chatCloseBtn">
            ✕
        </button>
    </div>
    
    <div class="chat-messages" id="chatMessages">
        <div class="chat-message bot">
            <div class="message-avatar bot-avatar">🤖</div>
            <div class="message-content">
                Hello! 👋 I'm your Farm2Fork AI assistant. I can help you find products, answer questions about our items, and assist with your shopping. What would you like to know?
            </div>
        </div>
    </div>
    
    <div class="chat-typing" id="chatTyping">
        <div class="typing-dot"></div>
        <div class="typing-dot"></div>
        <div class="typing-dot"></div>
    </div>
    
    <div class="chat-input-container">
        <input 
            type="text" 
            class="chat-input" 
            id="chatInput" 
            placeholder="Ask about our products..."
            autocomplete="off"
        >
        <button class="chat-send-btn" id="chatSendBtn">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="22" y1="2" x2="11" y2="13"></line>
                <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
            </svg>
        </button>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    // Elements
    const chatBtn = document.getElementById('aiChatBtn');
    const chatWindow = document.getElementById('aiChatWindow');
    const chatCloseBtn = document.getElementById('chatCloseBtn');
    const chatInput = document.getElementById('chatInput');
    const chatSendBtn = document.getElementById('chatSendBtn');
    const chatMessages = document.getElementById('chatMessages');
    const chatTyping = document.getElementById('chatTyping');
    const scrollTopBtn = document.getElementById('scrollTopBtn');

    // Toggle Chat Window
    chatBtn.addEventListener('click', function() {
        chatWindow.classList.toggle('active');
        if (chatWindow.classList.contains('active')) {
            chatInput.focus();
            scrollToBottom();
        }
    });

    // Close Chat Window
    chatCloseBtn.addEventListener('click', function() {
        chatWindow.classList.remove('active');
    });

    // Send Message on Button Click
    chatSendBtn.addEventListener('click', sendMessage);

    // Send Message on Enter Key
    chatInput.addEventListener('keypress', function(e) {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
        }
    });

    // Scroll to Top Button
    window.addEventListener('scroll', function() {
        if (window.pageYOffset > 300) {
            scrollTopBtn.style.display = 'flex';
        } else {
            scrollTopBtn.style.display = 'none';
        }
    });

    scrollTopBtn.addEventListener('click', function() {
        window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    // Send Message Function
    function sendMessage() {
        const message = chatInput.value.trim();
        
        if (message === '') return;

        // Disable input while sending
        chatInput.disabled = true;
        chatSendBtn.disabled = true;

        // Add user message to chat
        addMessage(message, 'user');
        chatInput.value = '';

        // Show typing indicator
        chatTyping.classList.add('active');
        scrollToBottom();

        // Send AJAX request
        fetch('{% url "ai_chat" %}', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': '{{ csrf_token }}'
            },
            body: JSON.stringify({
                message: message
            })
        })
        .then(response => response.json())
        .then(data => {
            // Hide typing indicator
            chatTyping.classList.remove('active');
            
            if (data.success) {
                addMessage(data.response, 'bot');
            } else {
                addMessage('Sorry, I encountered an error. Please try again.', 'bot');
            }
            
            // Re-enable input
            chatInput.disabled = false;
            chatSendBtn.disabled = false;
            chatInput.focus();
            scrollToBottom();
        })
        .catch(error => {
            console.error('Error:', error);
            chatTyping.classList.remove('active');
            addMessage('Sorry, something went wrong. Please try again later.', 'bot');
            chatInput.disabled = false;
            chatSendBtn.disabled = false;
            chatInput.focus();
        });
    }

    // Add Message to Chat
    function addMessage(text, sender) {
        const messageDiv = document.createElement('div');
        messageDiv.className = `chat-message ${sender}`;
        
        const avatar = document.createElement('div');
        avatar.className = `message-avatar ${sender}-avatar`;
        avatar.textContent = sender === 'user' ? '👤' : '🤖';
        
        const content = document.createElement('div');
        content.className = 'message-content';
        content.textContent = text;
        
        messageDiv.appendChild(avatar);
        messageDiv.appendChild(content);
        
        chatMessages.appendChild(messageDiv);
        scrollToBottom();
    }

    // Scroll to Bottom
    function scrollToBottom() {
        setTimeout(() => {
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }, 100);
    }
});
</script>
